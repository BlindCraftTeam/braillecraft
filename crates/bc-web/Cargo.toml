[package]
name = "bc-web"
description = "BrailleCraft in the browser: the core's translation, document files, layout and embossing for the web interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bc-core = { path = "../bc-core" }
wasm-bindgen = "=0.2.129"
# Embosser setups and layouts cross to the web interface as JSON, in the shape the desktop program keeps.
serde_json = "1"
