[workspace]
resolver = "2"
members = ["crates/bm-core", "crates/bm-louis", "crates/bm-shell", "crates/bm-desktop", "crates/bm-web"]
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
authors = ["Jeremiah Beasley <jbeasley@jb11.net>"]

# wxdragon-sys 0.9.22 with the printing functions BrailleCraft needs added (vendor/wxdragon-sys/CHANGES-BrailleCraft.txt).
[patch.crates-io]
wxdragon-sys = { path = "vendor/wxdragon-sys" }
