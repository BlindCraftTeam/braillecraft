[workspace]
resolver = "2"
members = ["crates/bc-core", "crates/bc-louis", "crates/bc-shell", "crates/bc-desktop", "crates/bc-web"]
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
authors = ["BlindCraft Team <info@blindcraft.dev>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/jeremiahbeasley/braillecraft"

# wxdragon-sys 0.9.22 with the printing functions BrailleCraft needs added (vendor/wxdragon-sys/CHANGES-BrailleCraft.txt).
[patch.crates-io]
wxdragon-sys = { path = "vendor/wxdragon-sys" }
