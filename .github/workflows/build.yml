# Builds BrailleMaker for Linux, Windows and macOS on every push to main and keeps the installers as
# downloads on the run page (Actions, the run, Artifacts). The macOS build is universal (Apple Silicon and Intel).
# Builds are unsigned: Windows SmartScreen and macOS Gatekeeper ask before the first launch.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            rust_targets: ""
            tauri_args: ""
            bundle_dir: target/release/bundle
          - name: windows
            os: windows-latest
            rust_targets: ""
            tauri_args: ""
            bundle_dir: target/release/bundle
          - name: macos
            os: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri_args: --target universal-apple-darwin
            bundle_dir: target/universal-apple-darwin/release/bundle
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libgl1-mesa-dev libglu1-mesa-dev libfontconfig-dev

      - name: Tests
        run: cargo test --workspace

      # The native desktop program (wxWidgets): a folder that runs as it is, with its braille fonts and its
      # translation tables, its document templates, its embosser models and its JAWS scripts beside it.
      - name: Native program
        shell: bash
        run: |
          cargo build --release -p bm-desktop
          mkdir -p dist/BrailleMaker
          cp target/release/braillemaker-desktop${{ runner.os == 'Windows' && '.exe' || '' }} dist/BrailleMaker/
          cp -r ui/fonts dist/BrailleMaker/fonts
          cp -r tables dist/BrailleMaker/tables
          cp -r templates dist/BrailleMaker/templates
          cp -r embossers dist/BrailleMaker/embossers
          cp -r scripts/jaws dist/BrailleMaker/jaws

      - uses: actions/upload-artifact@v7
        with:
          name: braillemaker-desktop-${{ matrix.name }}
          if-no-files-found: error
          path: dist/BrailleMaker

      - name: Build installers
        working-directory: crates/bm-shell
        run: npx -y @tauri-apps/cli@2.12.3 build ${{ matrix.tauri_args }}

      - uses: actions/upload-artifact@v7
        with:
          name: braillemaker-${{ matrix.name }}
          if-no-files-found: error
          path: |
            ${{ matrix.bundle_dir }}/msi/*.msi
            ${{ matrix.bundle_dir }}/nsis/*.exe
            ${{ matrix.bundle_dir }}/dmg/*.dmg
            ${{ matrix.bundle_dir }}/deb/*.deb
            ${{ matrix.bundle_dir }}/rpm/*.rpm
            ${{ matrix.bundle_dir }}/appimage/*.AppImage

  # The web build: the core as WebAssembly with its browser glue (wasm-bindgen at the version the workspace locks),
  # the web interface's menus and dialogs regenerated from the desktop program's tables (the run fails when the
  # committed copy differs), the braille fonts and the translation tables. The site is kept as a run artifact.
  web:
    name: web
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Web build
        run: |
          cargo install wasm-bindgen-cli --version 0.2.129 --locked
          python3 tools/web/make_web_tables.py
          git diff --exit-code ui-web/tables.js
          cargo build --release -p bm-web --target wasm32-unknown-unknown
          mkdir -p site/fonts site/tables/rule-scripts site/embossers
          wasm-bindgen --target web --no-typescript --out-dir site/pkg target/wasm32-unknown-unknown/release/bm_web.wasm
          cp ui-web/* site/
          cp ui/fonts/*.ttf ui/fonts/encodings.json site/fonts/
          # Every shipped table, fetched by the page when a document uses it, with the index and the list by language.
          cp tables/*.bmt tables/index.tsv tables/languages.tsv site/tables/
          cp tables/rule-scripts/*.rules site/tables/rule-scripts/
          cp embossers/embossers.txt site/embossers/
          cp -r templates site/templates

      - uses: actions/upload-artifact@v7
        with:
          name: braillemaker-web
          if-no-files-found: error
          path: site
