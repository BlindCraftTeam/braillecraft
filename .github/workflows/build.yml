# Builds BrailleCraft for Linux, Windows and macOS on every push to main and keeps the installers as
# downloads on the run page (Actions, the run, Artifacts). The macOS build is for the runner's processor (Apple
# Silicon).
# Builds are unsigned: Windows SmartScreen and macOS Gatekeeper ask before the first launch.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            rust_targets: ""
          - name: windows
            os: windows-latest
            rust_targets: ""
          - name: macos
            os: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libgl1-mesa-dev libglu1-mesa-dev libfontconfig-dev

      - name: Tests
        run: cargo test --workspace

      # The native desktop program (wxWidgets): a folder that runs as it is, with its braille fonts and its
      # translation tables, its document templates, its embosser models and its JAWS scripts beside it.
      - name: Native program
        shell: bash
        run: |
          cargo build --release -p bc-desktop
          mkdir -p dist/BrailleCraft
          cp target/release/braillecraft-desktop${{ runner.os == 'Windows' && '.exe' || '' }} dist/BrailleCraft/
          cp -r ui/fonts dist/BrailleCraft/fonts
          cp -r tables dist/BrailleCraft/tables
          cp -r templates dist/BrailleCraft/templates
          cp -r embossers dist/BrailleCraft/embossers
          cp -r scripts/jaws dist/BrailleCraft/jaws

      - uses: actions/upload-artifact@v7
        with:
          name: braillecraft-desktop-${{ matrix.name }}
          if-no-files-found: error
          path: dist/BrailleCraft

      # The dialogs as this system draws them (dlg::layout_check): each pair of overlapping controls and each control
      # past its dialog's edge, per dialog; then a picture of every dialog and of every page of the embosser setup
      # sheet, each opened by itself (BC_LAYOUT_SHOW). Kept as the braillecraft-layout-<system> artifact.
      - name: Dialog layout check
        shell: bash
        timeout-minutes: 25
        run: |
          mkdir -p layout/pictures
          exe=dist/BrailleCraft/braillecraft-desktop${{ runner.os == 'Windows' && '.exe' || '' }}
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get install -y xvfb x11-apps imagemagick > /dev/null
            Xvfb :99 -screen 0 1280x900x24 > /dev/null 2>&1 &
            export DISPLAY=:99
            sleep 2
          fi
          BC_LAYOUT_CHECK=layout/layout.txt $exe || true
          grep " found$" layout/layout.txt | grep -v ": 0 found" || true
          ids="$(grep -o 'name="dlg[0-9]*"' ui-native/dialogs.xrc | tr -dc '0-9\n' | grep -v -x -E '1000[0-4]') 10001 10002 10003 10004"
          for p in $ids; do
            BC_LAYOUT_SHOW=$p $exe & pid=$!
            sleep 4
            case "$RUNNER_OS" in
              macOS) screencapture -x layout/pictures/$p.png || true ;;
              Linux) xwd -root -silent | convert xwd:- layout/pictures/$p.png || true ;;
              Windows) powershell -NoProfile -File tools/ci/screenshot.ps1 layout/pictures/$p.png || true ;;
            esac
            if [ "$RUNNER_OS" = Windows ]; then taskkill //F //IM braillecraft-desktop.exe > /dev/null 2>&1 || true; else kill $pid 2> /dev/null || true; fi
            sleep 1
          done
          ls layout/pictures | wc -l

      - uses: actions/upload-artifact@v7
        with:
          name: braillecraft-layout-${{ matrix.name }}
          path: layout

      # The Windows installer of the native program (packaging/windows, WiX Toolset 5), laid out as the reference
      # program's installer (re/spec/26-installer.md).
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: bash
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2 WixToolset.Util.wixext/5.0.2
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          python packaging/windows/fonts_fragment.py dist/BrailleCraft/fonts > fonts.wxs
          mkdir -p installers
          wix build packaging/windows/braillecraft.wxs fonts.wxs -arch x64 -ext WixToolset.UI.wixext -ext WixToolset.Util.wixext -d Version=$version -bindpath "dist=$(cygpath -w "$PWD/dist/BrailleCraft")" -bindpath "icons=$(cygpath -w "$PWD/packaging/icons")" -o installers/BrailleCraft-$version-x64.msi

      - uses: actions/upload-artifact@v7
        if: runner.os == 'Windows'
        with:
          name: braillecraft-windows-installer
          if-no-files-found: error
          path: installers/*.msi

      # The Linux packages of the native program (packaging/linux): .deb and .rpm with the same layout, and an
      # AppImage made with appimagetool 1.9.1 (checked against its published checksum).
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y rpm dpkg-dev
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          bash packaging/linux/build-packages.sh dist/BrailleCraft $version installers
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool" | sha256sum -c -
          chmod 755 appimagetool
          APPIMAGE_EXTRACT_AND_RUN=1 APPIMAGETOOL=$PWD/appimagetool bash packaging/linux/build-appimage.sh dist/BrailleCraft $version installers

      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: braillecraft-linux-packages
          if-no-files-found: error
          path: |
            installers/*.deb
            installers/*.rpm
            installers/*.AppImage

      # The macOS application bundle and disk image of the native program (packaging/macos).
      - name: macOS disk image
        if: runner.os == 'macOS'
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          bash packaging/macos/build-app.sh dist/BrailleCraft $version installers

      # The program starts on macOS, from the plain folder and from the application in the disk image, loads its
      # braille fonts and its tables, and writes formatted braille: a line of text saved as BRF on the command line.
      # Any message about the fonts fails the step.
      - name: macOS start check
        if: runner.os == 'macOS'
        timeout-minutes: 5
        run: |
          printf 'BrailleCraft start check.\n' > check.txt
          check() {
            rm -f check.brf
            "$1" /brf:check.brf check.txt 2> err.txt || true
            cat err.txt
            if grep -i "^BrailleCraft:.*font" err.txt; then echo "font message from $1"; exit 1; fi
            test -s check.brf || { echo "no BRF written by $1"; exit 1; }
            cat check.brf
          }
          check dist/BrailleCraft/braillecraft-desktop
          hdiutil attach installers/*.dmg -mountpoint /tmp/bcdmg -nobrowse
          check /tmp/bcdmg/BrailleCraft.app/Contents/MacOS/braillecraft-desktop
          hdiutil detach /tmp/bcdmg

      - uses: actions/upload-artifact@v7
        if: runner.os == 'macOS'
        with:
          name: braillecraft-macos-installer
          if-no-files-found: error
          path: installers/*.dmg

  # The web build: the core as WebAssembly with its browser glue (wasm-bindgen at the version the workspace locks),
  # the web interface's menus and dialogs regenerated from the desktop program's tables (the run fails when the
  # committed copy differs), the braille fonts and the translation tables. The site is kept as a run artifact.
  web:
    name: web
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Web build
        run: |
          cargo install wasm-bindgen-cli --version 0.2.129 --locked
          python3 tools/web/make_web_tables.py
          git diff --exit-code ui-web/tables.js
          cargo build --release -p bc-web --target wasm32-unknown-unknown
          mkdir -p site/fonts site/tables/rule-scripts site/embossers
          wasm-bindgen --target web --no-typescript --out-dir site/pkg target/wasm32-unknown-unknown/release/bc_web.wasm
          cp ui-web/* site/
          cp ui/fonts/*.ttf ui/fonts/encodings.json site/fonts/
          # Every shipped table, fetched by the page when a document uses it, with the index and the list by language.
          cp tables/*.bmt tables/index.tsv tables/languages.tsv site/tables/
          cp tables/rule-scripts/*.rules site/tables/rule-scripts/
          cp embossers/embossers.txt site/embossers/
          cp -r templates site/templates

      - uses: actions/upload-artifact@v7
        with:
          name: braillecraft-web
          if-no-files-found: error
          path: site
